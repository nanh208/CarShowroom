<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)">
    <!-- Sleeves -->
    <path d="M70 120 L130 90 L150 160 L90 190 Z" fill="#f05a1a" stroke="#333" stroke-width="2"/>
    <path d="M330 120 L270 90 L250 160 L310 190 Z" fill="#f05a1a" stroke="#333" stroke-width="2"/>
    <!-- Sleeve Cuffs -->
    <path d="M70 120 L90 190 L80 195 L60 125 Z" fill="#18181b"/>
    <path d="M330 120 L310 190 L320 195 L340 125 Z" fill="#18181b"/>
    <!-- Body -->
    <path d="M125 90 L275 90 L295 330 L105 330 Z" fill="#f05a1a" stroke="#222" stroke-width="2.5"/>
    <!-- Side vents / hem -->
    <line x1="105" y1="330" x2="295" y2="330" stroke="#ffd166" stroke-width="6"/>
    <!-- Racing chest stripe -->
    <rect x="110" y="180" width="180" height="28" fill="#18181b" opacity="0.9"/>
    <text x="200" y="198" fill="#ffffff" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">ARES RACING TEAM</text>
    <!-- Left chest emblem -->
    <circle cx="150" cy="145" r="14" fill="#ffd166"/>
    <path d="M144 145 L150 137 L156 145 L150 152 Z" fill="#fff"/>
    <!-- Placket & Buttons -->
    <rect x="188" y="90" width="24" height="60" fill="#18181b" stroke="#222" stroke-width="1.5"/>
    <circle cx="200" cy="108" r="3" fill="#fff"/>
    <circle cx="200" cy="126" r="3" fill="#fff"/>
    <circle cx="200" cy="142" r="3" fill="#fff"/>
    <!-- Collar -->
    <path d="M150 90 L200 120 L188 90 Z" fill="#18181b" stroke="#222" stroke-width="2"/>
    <path d="M250 90 L200 120 L212 90 Z" fill="#18181b" stroke="#222" stroke-width="2"/>
    <path d="M150 90 Q200 100 250 90" fill="none" stroke="#ffd166" stroke-width="3"/>
  </g>
</svg>