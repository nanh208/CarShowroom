<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu vận đơn - Ares Store</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <style>
    body { justify-content:flex-start; }
    .page { width:min(820px,100%); margin:0 auto; }
    .panel { background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:24px; margin-bottom:18px; backdrop-filter:blur(16px); }
    h1 { font-size:24px; margin-bottom:8px; }
    h2 { font-size:17px; margin-bottom:16px; }
    p,.muted { color:#94a3b8; font-size:14px; line-height:1.6; }
    a { color:#7dd3fc; text-decoration:none; }
    label { display:block; color:#cbd5e1; font-size:13px; margin:14px 0 6px; }
    input { width:100%; height:44px; border-radius:8px; border:1px solid #475569; padding:0 12px; color:#0f172a; background:#f1f5f9; font:inherit; }
    button { margin-top:12px; border:0; border-radius:8px; padding:11px 16px; background:#0284c7; color:white; font-weight:700; cursor:pointer; }
    .tracking { font-family:monospace; color:#7dd3fc; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
    .summary div { padding:12px; border-radius:10px; background:rgba(255,255,255,.04); }
    .summary small { display:block; color:#94a3b8; margin-bottom:5px; }
    .summary strong { color:#f8fafc; }
    .notice { padding:12px; border-radius:9px; color:#fecaca; background:rgba(239,68,68,.13); }
    .timeline { list-style:none; padding:0; margin:0; }
    .timeline li { position:relative; border-left:2px solid rgba(56,189,248,.4); padding:0 0 20px 20px; margin-left:6px; }
    .timeline li:last-child { border-left-color:transparent; padding-bottom:0; }
    .timeline li::before { content:""; position:absolute; left:-7px; top:3px; width:12px; height:12px; border-radius:50%; background:#38bdf8; }
    .timeline time { display:block; font-size:12px; color:#94a3b8; margin-bottom:4px; }
    .timeline strong { color:#f8fafc; font-size:14px; }
    .timeline p { margin:4px 0 0; }
    .top-link { display:flex; justify-content:space-between; gap:12px; margin-bottom:14px; }
    @media(max-width:600px){body{padding:14px 10px}.panel{padding:18px}h1{font-size:21px}}
  </style>
</head>
<body>
<main class="page">
  <div class="top-link"><a th:href="@{/login}">Ares Store</a><a th:href="@{/transport/track}">Tra cứu vận đơn</a></div>
  <section class="panel">
    <h1>Tra cứu vận đơn</h1>
    <p>Nhập mã vận đơn để xem trạng thái và lịch sử cập nhật giao hàng.</p>
    <form th:action="@{/transport/track}" method="get">
      <label for="trackingNumber">Mã vận đơn</label>
      <input id="trackingNumber" name="trackingNumber" th:value="${trackingNumber}" required maxlength="40" placeholder="ARES-XXXXXXXXXXXX" autocomplete="off">
      <button type="submit">Tra cứu</button>
    </form>
  </section>

  <section th:if="${searched and tracking == null}" class="panel notice" role="status">Không tìm thấy vận đơn. Vui lòng kiểm tra lại mã tra cứu.</section>

  <section th:if="${tracking != null}" class="panel" aria-live="polite">
    <h2>Hành trình giao hàng</h2>
    <div class="summary">
      <div><small>Mã vận đơn</small><strong class="tracking" th:text="${tracking.trackingNumber}"></strong></div>
      <div><small>Mã đơn</small><strong th:text="${tracking.orderCode}"></strong></div>
      <div><small>Đơn vị vận chuyển</small><strong th:text="${tracking.carrier}"></strong></div>
      <div><small>Trạng thái hiện tại</small><strong th:text="${tracking.status.label}"></strong></div>
    </div>
    <ol class="timeline">
      <li th:each="event : ${tracking.events}">
        <time th:text="${#temporals.format(event.occurredAt, 'dd/MM/yyyy HH:mm')}"></time>
        <strong th:text="${event.status.label}"></strong>
        <p th:text="${event.description}"></p>
      </li>
    </ol>
  </section>
</main>
</body>
</html>
