<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - Ares Store</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Ares Store Brand Logo -->
    <a th:href="@{/login}" class="brand-header">
      <img th:src="@{/images/logo.png}" alt="Ares Store Logo" class="brand-logo-img">
    </a>

    <!-- Page Title -->
    <h1 class="auth-heading">Quên mật khẩu</h1>

    <!-- Glassmorphic Card -->
    <div class="auth-card">

      <!-- STEP 1: Trang quên mật khẩu (thiết kế ban đầu) - Figma Ảnh 4 -->
      <div id="step1-pane" class="step-pane active">
        <form id="forgotFormStep1">
          <!-- Phone/Email -->
          <div class="form-group">
            <label class="form-label" for="phoneOrEmail">Phone/Email</label>
            <input type="text" id="phoneOrEmail" name="phoneOrEmail" class="form-control" required autocomplete="username" placeholder="Nhập email hoặc số điện thoại">
          </div>

          <!-- Mã xác nhận with Resend button & 119s countdown -->
          <div class="form-group">
            <label class="form-label" for="forgotCode">Mã xác nhận</label>
            <div class="code-input-container">
              <input type="text" id="forgotCode" name="forgotCode" class="form-control" required placeholder="Nhập mã xác nhận">
              <div id="forgotTimerIndicator" class="timer-indicator">119s</div>
              <button type="button" id="btnResendForgot" class="btn-resend">Gửi lại</button>
            </div>
          </div>

          <!-- Tiếp tục Button -->
          <button type="submit" class="btn-primary" style="margin-top: 20px;">Tiếp tục</button>

          <!-- Back to Login -->
          <div class="card-footer-nav">
            <a th:href="@{/login}">Quay lại đăng nhập</a>
          </div>
        </form>
      </div>

      <!-- STEP 2: Trang quên mật khẩu 2 (thiết kế ban đầu) - Figma Ảnh 5 -->
      <div id="step2-pane" class="step-pane">
        <form id="forgotFormStep2">
          <input type="hidden" id="resetTarget" name="resetTarget">
          <input type="hidden" id="resetCode" name="resetCode">

          <!-- Mật khẩu mới -->
          <div class="form-group">
            <label class="form-label" for="newPassword">Mật khẩu mới</label>
            <input type="password" id="newPassword" name="newPassword" class="form-control" required autocomplete="new-password">
          </div>

          <!-- Mật khẩu xác minh -->
          <div class="form-group">
            <label class="form-label" for="confirmNewPassword">Mật khẩu xác minh</label>
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="form-control" required autocomplete="new-password">
          </div>

          <!-- Đặt lại Button -->
          <button type="submit" class="btn-primary" style="margin-top: 20px;">Đặt lại</button>

          <!-- Back to Login -->
          <div class="card-footer-nav">
            <a th:href="@{/login}">Hủy bỏ và quay lại</a>
          </div>
        </form>
      </div>

    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script th:src="@{/js/auth.js?v=2.0}"></script>
</body>
</html>
