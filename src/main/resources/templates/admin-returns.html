<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý đổi trả | ARES Toys</title>
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <style>
    body { background: #f5f2ed; color: #222; font-family: Arial, sans-serif; margin: 0; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 18px; }
    .admin-head, .admin-controls, .return-card, .return-line { background: #fff; border: 1px solid #d7d0c8; padding: 16px; }
    .admin-head h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .admin-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin: 16px 0; }
    .admin-controls label { flex: 1 1 300px; display: grid; gap: 6px; font-weight: 600; }
    .admin-controls input, .return-card textarea, .return-card select { padding: 10px; border: 1px solid #bbb; font: inherit; }
    .return-list { display: grid; gap: 12px; }
    .return-card h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .return-meta { color: #555; line-height: 1.6; white-space: pre-line; }
    .return-lines { display: grid; gap: 6px; margin: 10px 0; }
    .return-line { padding: 9px; }
    .return-card textarea { width: 100%; box-sizing: border-box; min-height: 70px; margin: 8px 0; }
    .return-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .return-actions select { min-width: 180px; }
    #adminMessage { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <header class="admin-head">
      <h1>Quản lý yêu cầu đổi trả</h1>
      <p>Chỉ gửi quyết định sau khi đã kiểm tra đơn và xử lý ngoài hệ thống. Đánh dấu hoàn tất không tự thực hiện chuyển tiền.</p>
    </header>
    <section class="admin-controls" aria-label="Xác thực quản trị">
      <label>Mã quản trị
        <input id="adminToken" type="password" autocomplete="off" placeholder="Mã cấu hình ARES_ADMIN_TOKEN">
      </label>
      <button class="cart-btn-checkout" id="loadReturns" type="button">Tải yêu cầu</button>
      <button class="cart-btn-clear" id="forgetAdminToken" type="button">Xóa mã khỏi phiên</button>
    </section>
    <p id="adminMessage" role="status" aria-live="polite"></p>
    <section id="returnList" class="return-list" aria-live="polite"></section>
  </main>
  <script th:src="@{/js/admin-returns.js}"></script>
</body>
</html>
