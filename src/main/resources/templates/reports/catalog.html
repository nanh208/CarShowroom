<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo danh mục sản phẩm - Ares Store</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <style>
    body{justify-content:flex-start}.page{width:min(1180px,100%);margin:0 auto}
    .top,.panel,.metric{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:22px;margin-bottom:18px;backdrop-filter:blur(16px)}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.top h1{font-size:24px;margin-bottom:5px}
    .top p,.muted{color:#94a3b8;font-size:13px}a{color:#7dd3fc;text-decoration:none}h2{font-size:17px;margin-bottom:12px}
    .filters,.metrics{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.filters label{display:grid;gap:5px;color:#cbd5e1;font-size:12px}
    input,select{height:40px;border-radius:8px;border:1px solid #475569;padding:0 10px;color:#0f172a;background:#f1f5f9;font:inherit}
    button,.button{border:0;border-radius:8px;padding:10px 13px;background:#0284c7;color:white;font-weight:700;cursor:pointer;display:inline-block}
    .metrics{align-items:stretch}.metric{flex:1 1 180px;margin:0}.metric strong{display:block;font-size:24px;margin-top:7px}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;vertical-align:top}th{color:#94a3b8;font-weight:600}
    .yes{color:#a7f3d0}.no{color:#fca5a5}@media(max-width:600px){body{padding:14px 10px}.top,.panel,.metric{padding:16px}.top h1{font-size:20px}}
  </style>
</head>
<body>
<main class="page">
  <header class="top">
    <div><h1>🚘 Báo cáo danh mục sản phẩm</h1><p>Tìm kiếm, lọc tồn và xuất dữ liệu catalog hiện có.</p></div>
    <div><span class="muted" th:text="|Xin chào, ${user.username}|">Xin chào</span> &nbsp; <a th:href="@{/inventory/warehouses}">Quản lý kho</a> &nbsp; <a th:href="@{/home}">Trang chủ</a></div>
  </header>
  <section class="metrics" aria-label="Tổng quan danh mục">
    <article class="metric"><span class="muted">Tổng sản phẩm</span><strong th:text="${catalogCount}">0</strong></article>
    <article class="metric"><span class="muted">Đang có hàng</span><strong th:text="${availableCount}">0</strong></article>
    <article class="metric"><span class="muted">Hết hàng</span><strong th:text="${unavailableCount}">0</strong></article>
  </section>
  <section class="panel">
    <form class="filters" method="get" th:action="@{/reports/catalog}">
      <label>Tìm tên hoặc mã<input name="keyword" maxlength="120" th:value="${keyword}" placeholder="Huracan, PS 340..."></label>
      <label>Danh mục<select name="category"><option value="">Tất cả danh mục</option><option th:each="option : ${categories}" th:value="${option}" th:text="${option}" th:selected="${category == option}"></option></select></label>
      <label>Tình trạng<select name="availability"><option value="">Tất cả</option><option value="AVAILABLE" th:selected="${availability == 'AVAILABLE'}">Còn hàng</option><option value="OUT" th:selected="${availability == 'OUT'}">Hết hàng</option></select></label>
      <button type="submit">Lọc danh mục</button>
      <a class="button" th:href="@{/reports/catalog/csv(keyword=${keyword},category=${category},availability=${availability})}">Tải CSV</a>
    </form>
  </section>
  <section class="panel">
    <h2 th:text="|Sản phẩm phù hợp: ${#lists.size(cars)}|">Sản phẩm</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Mã / tên</th><th>Danh mục</th><th>Tỉ lệ / chất liệu</th><th>Giá</th><th>Tình trạng</th><th>Đã bán</th><th>Đánh giá</th></tr></thead>
      <tbody>
        <tr th:each="car : ${cars}">
          <td><strong th:text="${car.code != null ? car.code : '—'}"></strong><br><span th:text="${car.name}"></span></td>
          <td><span th:text="${car.category != null ? car.category : '—'}"></span><br><small class="muted" th:text="${car.section != null ? car.section : ''}"></small></td>
          <td><span th:text="${car.scale != null ? car.scale : '—'}"></span><br><small class="muted" th:text="${car.material != null ? car.material : ''}"></small></td>
          <td><span th:text="${car.formattedPrice}"></span><br><small class="muted" th:if="${car.oldPrice != null}" th:text="${car.formattedOldPrice}"></small></td>
          <td th:class="${car.inStock ? 'yes' : 'no'}" th:text="${car.inStock ? 'Còn hàng' : 'Hết hàng'}"></td>
          <td th:text="${car.soldCount != null ? car.soldCount : 0}"></td>
          <td th:text="|${car.rating != null ? car.rating : 0} · ${car.reviewCount != null ? car.reviewCount : 0} lượt|"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(cars)}"><td colspan="7" class="muted">Không có sản phẩm khớp với bộ lọc.</td></tr>
      </tbody>
    </table></div>
  </section>
</main>
</body>
</html>
