<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${car.name} · ARES|"></title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><header><a th:href="@{/home}" class="brand">ARES <span>CATALOG</span></a><a th:href="@{/catalog}">← Danh mục sản phẩm</a></header>
<main><div class="detail"><div><img class="hero" th:if="${car.image != null and !#strings.isEmpty(car.image)}" th:src="${car.image}" th:alt="${car.name}"></div><section><p class="eyebrow" th:text="${car.category}"></p><h1 th:text="${car.name}"></h1><p th:text="|Mã sản phẩm: ${car.code}|"></p><strong class="price" th:text="${car.formattedPrice}"></strong> <del th:if="${car.oldPrice != null and car.oldPrice > car.price}" th:text="${car.formattedOldPrice}"></del><p th:text="${car.inStock == true ? 'Còn hàng' : 'Hết hàng'}"></p><p th:text="${car.description}"></p><dl><dt>Tỷ lệ</dt><dd th:text="${car.scale}"></dd><dt>Chất liệu</dt><dd th:text="${car.material}"></dd><dt>Tính năng</dt><dd th:text="${car.features}"></dd><dt>Đánh giá</dt><dd th:text="|${car.rating} / 5 (${car.reviewCount} đánh giá)|"></dd></dl><a class="button" th:href="@{/catalog(category=${car.category})}">Xem cùng danh mục</a></section></div>
<section th:if="${!#lists.isEmpty(related)}"><h2>Có thể bạn thích</h2><div class="grid"><article class="card" th:each="item : ${related}"><a th:href="@{/catalog/{id}(id=${item.id})}"><img th:src="${item.image}" th:alt="${item.name}" loading="lazy"><div class="card-body"><h3 th:text="${item.name}"></h3><strong class="price" th:text="${item.formattedPrice}"></strong></div></a></article></div></section></main><footer>ARES · Khám phá bộ sưu tập</footer></body></html>
