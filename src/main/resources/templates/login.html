<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ares Store</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Ares Store Brand Logo -->
    <a th:href="@{/login}" class="brand-header">
      <img th:src="@{/images/logo.png}" alt="Ares Store Logo" class="brand-logo-img">
    </a>

    <!-- Page Title -->
    <h1 class="auth-heading">Login</h1>

    <!-- Glassmorphic Card -->
    <div class="auth-card">

      <!-- Feedback Alerts -->
      <div th:if="${param.error}" class="alert alert-danger">
        <span>Tên đăng nhập hoặc mật khẩu không chính xác!</span>
      </div>
      <div th:if="${param.registered}" class="alert alert-success">
        <span>Đăng ký thành công! Hãy đăng nhập ngay.</span>
      </div>
      <div th:if="${param.resetSuccess}" class="alert alert-success">
        <span>Đặt lại mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới.</span>
      </div>
      <div th:if="${param.logout}" class="alert alert-info">
        <span>Bạn đã đăng xuất an toàn.</span>
      </div>

      <!-- Login Form -->
      <form th:action="@{/login}" method="post" id="loginForm">
        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Hiện/ẩn mật khẩu">
              <svg class="eye-icon eye-slash" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
              <svg class="eye-icon eye-open" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Links Row: Forgot password? & Register -->
        <div class="links-row">
          <a th:href="@{/forgot-password}" class="auth-link">Forgot password?</a>
          <a th:href="@{/register}" class="auth-link">Register</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-primary">Login</button>

        <!-- Divider Or -->
        <div class="auth-divider">Or</div>

        <!-- Sign in with OAuth -->
        <a th:href="@{/oauth2/google}" class="btn-oauth">
          <svg class="oauth-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Sign in with OAuth
        </a>
      </form>

    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script th:src="@{/js/auth.js?v=3.0}"></script>
</body>
</html>
