<body>

            <div style="color:#94a3b8;">GiÃ¡ sÃ n hiá»‡n táº¡i:</div>

    <script th:inline="javascript">
        const auctionId = /*[[${auctionId}]]*/ 1;
        let nextMin = 0;

        async function loadDetail() {
            try {
                const res = await fetch(`/api/auctions/${auctionId}`);
                const resData = await res.json();
                const a = resData.data;
                document.getElementById('auctionTitle').innerText = a.title;
                document.getElementById('currentPrice').innerText = new Intl.NumberFormat('vi-VN').format(a.currentPrice) + ' â‚«';
                nextMin = a.currentPrice + (a.minimumIncrement || 1000000);
                document.getElementById('nextMinText').innerText = `Má»©c giÃ¡ tá»‘i thiá»ƒu káº¿ tiáº¿p: ${new Intl.NumberFormat('vi-VN').format(nextMin)} â‚«`;
                document.getElementById('bidInput').value = nextMin;
                document.getElementById('carImg').src = a.image || 'https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=800&q=80';
                document.getElementById('carDesc').innerText = a.description || 'Chiáº¿c xe nguyÃªn báº£n, Ä‘áº§y Ä‘á»§ sá»• báº£o hÃ nh chÃ­nh hÃ£ng, sáºµn sÃ ng giao dá»‹ch.';
            } catch(e) { console.error(e); }

        async function loadBids() {
            try {
                const res = await fetch(`/api/auctions/${auctionId}/bids`);
                const resData = await res.json();
                const list = resData.data || [];
                const container = document.getElementById('bidHistoryList');
                if (list.length === 0) {
                    container.innerHTML = '<span style="color:#64748b;">ChÆ°a cÃ³ lÆ°á»£t Ä‘áº·t giÃ¡ nÃ o.</span>';

                        <strong style="color:#38bdf8;">${new Intl.NumberFormat('vi-VN').format(b.amount)} â‚«</strong>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function addQuick(val) {
            const inp = document.getElementById('bidInput');
            inp.value = Number(inp.value || nextMin) + val;
        }

        async function placeBid() {
            const amount = document.getElementById('bidInput').value;
            const msgBox = document.getElementById('bidMsg');
            msgBox.innerText = 'Äang gá»­i...';
            try {

                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ amount: Number(amount) })
                });
                const result = await res.json();
                if (result.success) {
                    msgBox.style.color = '#4ade80';
                    msgBox.innerText = 'Äáº·t giÃ¡ thÃ nh cÃ´ng!';
                    loadDetail();
                    loadBids();

            } catch(e) {

            }
        }

        loadDetail();
        loadBids();
        setInterval(loadBids, 3000);
    </script>
