spring.application.name=model-car-shop
server.port=8080

# ===== Database: H2 (mặc định, file trong ./data) =====
spring.datasource.url=jdbc:h2:file:./data/modelshop;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-secret-key-at-least-32-bytes-long!!}
app.jwt.expiration-ms=86400000

# ===== CORS / Frontend =====
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===== OAuth2 (điền client id/secret thật qua biến môi trường) =====
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth.redirect-base=${OAUTH_REDIRECT_BASE:http://localhost:8080}
# Tuỳ chọn: ghi đè redirect URI (mặc định = OAUTH_REDIRECT_BASE/api/auth/oauth/{google|facebook}/callback)
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
app.oauth.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:}
app.oauth.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v19.0}

# ===== Thanh toán thật (đơn chỉ PAID khi tiền thật sự vào) =====
# URL công khai của backend (dùng cho IPN/return MoMo, VNPay). VD: https://api.aresshop.vn
app.payment.public-base-url=${PAYMENT_PUBLIC_BASE_URL:${OAUTH_REDIRECT_BASE:http://localhost:8080}}
# Tài khoản nhận chuyển khoản (VietQR) – VietinBank BIN 970415
app.payment.bank.bin=${BANK_BIN:970415}
app.payment.bank.name=${BANK_NAME:VietinBank}
app.payment.bank.account-no=${BANK_ACCOUNT_NO:108876543210}
app.payment.bank.account-name=${BANK_ACCOUNT_NAME:ARES TOYS SHOWROOM - NGUYEN VAN CHU}
app.payment.bank.qr-template=${BANK_QR_TEMPLATE:compact2}
# SePay webhook: header "Authorization: Apikey <SEPAY_API_KEY>"
app.payment.sepay.enabled=${PAYMENT_SEPAY_ENABLED:false}
app.payment.sepay.api-key=${SEPAY_API_KEY:}
# payOS
app.payment.payos.enabled=${PAYMENT_PAYOS_ENABLED:false}
app.payment.payos.client-id=${PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${PAYOS_API_KEY:}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
# Casso (Webhook V2: CASSO_CHECKSUM_KEY; Webhook V1 cũ: CASSO_SECURE_TOKEN)
app.payment.casso.enabled=${PAYMENT_CASSO_ENABLED:false}
app.payment.casso.checksum-key=${CASSO_CHECKSUM_KEY:}
app.payment.casso.secure-token=${CASSO_SECURE_TOKEN:}
app.payment.casso.max-age-seconds=${CASSO_MAX_AGE_SECONDS:300}
# MoMo (sandbox: https://test-payment.momo.vn ; production: https://payment.momo.vn)
app.payment.momo.enabled=${PAYMENT_MOMO_ENABLED:false}
app.payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:}
# VNPay (sandbox: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html)
app.payment.vnpay.enabled=${PAYMENT_VNPAY_ENABLED:false}
app.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
# Giả lập tiền vào cho dev (chỉ ADMIN).
app.payment.dev-simulate.enabled=${PAYMENT_DEV_SIMULATE_ENABLED:true}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB
